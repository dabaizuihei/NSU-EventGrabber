name: Build Release Packages

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  APP_VERSION: "v1.0.2"
  RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || 'v1.0.2' }}

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run unit tests
        run: python -m unittest discover -s tests -t . -v

  prepare:
    name: Prepare release
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create release if missing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; updating title to $APP_VERSION"
            gh release edit "$RELEASE_TAG" --title "NSU-EventGrabber $APP_VERSION" --notes ""
          else
            gh release create "$RELEASE_TAG" \
              --title "NSU-EventGrabber $APP_VERSION" \
              --notes ""
          fi

  windows:
    name: Windows x64
    needs: prepare
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pywebview>=4.4" "pyinstaller>=6" "pystray>=0.19.5" "Pillow>=10"
      - name: Build GUI
        run: pyinstaller --noconfirm --clean packaging/NSU-EventGrabber.spec
      - name: Rename Windows build
        shell: pwsh
        run: |
          Copy-Item "dist\NSU-EventGrabber.exe" "dist\NSU-EventGrabber-Windows-x86_64.exe"
      - name: Upload Windows build to release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release upload $env:RELEASE_TAG "dist\NSU-EventGrabber-Windows-x86_64.exe" --clobber

  macos:
    name: macOS ${{ matrix.arch }}
    needs: prepare
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: x86_64
          - runner: macos-15
            arch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pywebview>=4.4" "pyinstaller>=6" "pystray>=0.19.5" "Pillow>=10"
      - name: Build app
        run: pyinstaller --noconfirm --clean packaging/NSU-EventGrabber.spec
      - name: Make drag-to-install DMG
        run: |
          bash packaging/build_macos_dmg.sh \
            "dist/NSU-EventGrabber.app" \
            "dist/NSU-EventGrabber-macOS-${{ matrix.arch }}.dmg"
      - name: Upload DMG to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$RELEASE_TAG" \
            "dist/NSU-EventGrabber-macOS-${{ matrix.arch }}.dmg" --clobber

  linux:
    name: Linux x86_64
    needs: prepare
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install WebKitGTK
        run: |
          set -e
          for attempt in 1 2 3; do
            timeout 180 sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=15 update || true
            if timeout 300 sudo DEBIAN_FRONTEND=noninteractive apt-get \
              -o Acquire::Retries=2 -o Acquire::http::Timeout=15 \
              install -y --no-install-recommends \
              python3-venv python3-pip python3-gi python3-gi-cairo \
              gir1.2-gtk-3.0 gir1.2-webkit2-4.0 \
              gir1.2-ayatanaappindicator3-0.1 \
              libgtk-3-0 libwebkit2gtk-4.0-37; then
              exit 0
            fi
            sleep 10
          done
          exit 1
      - name: Build app
        run: |
          python3 -m venv .venv --system-site-packages
          . .venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install "pywebview>=4.4" "pyinstaller>=6" "pystray>=0.19.5" "Pillow>=10"
          pyinstaller --noconfirm --clean packaging/NSU-EventGrabber.spec
      - name: Make AppImage
        run: |
          APPDIR=dist/NSU-EventGrabber.AppDir
          mkdir -p "$APPDIR/usr/bin" "$APPDIR/usr/share/applications" \
            "$APPDIR/usr/share/icons/hicolor/256x256/apps"
          cp -a dist/NSU-EventGrabber/. "$APPDIR/usr/bin/"
          cp packaging/NSU-EventGrabber.desktop "$APPDIR/usr/share/applications/"
          cp packaging/NSU-EventGrabber.desktop "$APPDIR/NSU-EventGrabber.desktop"
          cp packaging/NSU-EventGrabber.png "$APPDIR/NSU-EventGrabber.png"
          cp packaging/NSU-EventGrabber.png \
            "$APPDIR/usr/share/icons/hicolor/256x256/apps/NSU-EventGrabber.png"
          ln -sf NSU-EventGrabber.png "$APPDIR/.DirIcon"
          cat > "$APPDIR/AppRun" <<'EOF'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/usr/bin/NSU-EventGrabber" "$@"
          EOF
          chmod +x "$APPDIR/AppRun"
          curl -fsSL \
            https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage \
            -o /tmp/appimagetool
          chmod +x /tmp/appimagetool
          ARCH=x86_64 VERSION="$APP_VERSION" /tmp/appimagetool --appimage-extract-and-run \
            "$APPDIR" "dist/NSU-EventGrabber-Linux-x86_64.AppImage"
      - name: Upload AppImage to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$RELEASE_TAG" \
            "dist/NSU-EventGrabber-Linux-x86_64.AppImage" --clobber

  pages:
    name: Publish update manifest
    needs: [windows, macos, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build version manifest
        run: |
          mkdir -p site
          python3 -c 'import json,os; from datetime import datetime,timezone; v=os.environ["APP_VERSION"]; t=os.environ["RELEASE_TAG"]; r=os.environ["GITHUB_REPOSITORY"]; m={"version":v,"tag":t,"name":f"NSU-EventGrabber {v}","url":f"https://github.com/{r}/releases/tag/{t}","published_at":datetime.now(timezone.utc).isoformat().replace("+00:00","Z")}; open("site/version.json","w",encoding="utf-8").write(json.dumps(m,ensure_ascii=False)); open("site/index.html","w",encoding="utf-8").write("<!doctype html><meta charset=utf-8><title>NSU-EventGrabber</title><p><a href=version.json>version.json</a></p>")'
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5

  cleanup:
    name: Remove legacy assets
    needs: [windows, macos, linux]
    runs-on: ubuntu-latest
    steps:
      - name: Delete obsolete release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$RELEASE_TAG" --json assets \
            --jq '.assets[] | select(.name == "NSU-EventGrabber.exe" or (.name | contains("Portable"))) | .id' |
          while read -r asset_id; do
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}"
          done
